document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"4ec2f976-f964-4c06-9568-e4af54b7ebf0\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <meta name=\"robots\" content=\"noindex, nofollow\">\n  <title>Iscrizione confermata – TheBigFrame 2026<\u002Ftitle>\n  \n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  <style>/* vietnamese */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 400 900;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"33b2736b-4afe-4636-9a21-71b5bfb55545\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 400 900;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"fc78f79e-6074-4e50-8687-7e83cb490e44\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 400 900;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"40760c9a-46cd-40a9-a99c-21dfb603ff0e\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n  <style>\n    html, body { margin: 0; background: #F7F4EC; overflow-x: hidden; }\n    * { box-sizing: border-box; }\n    a { color: #E6592E; text-decoration: none; }\n    a:hover { color: #B8441F; }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"font-family:'Archivo',sans-serif;color:#1B1A17;background:#F7F4EC;min-height:100vh;\">\n\n  <div data-screen-label=\"Conferma\" style=\"background:#1B1A17;color:#F7F4EC;padding:clamp(40px,7vw,72px) 24px clamp(56px,9vw,96px);\">\n    <div style=\"max-width:880px;margin:0 auto;\">\n      <a href=\"https://thebigframe.it\" style=\"display:block;width:fit-content;margin-bottom:clamp(36px,6vw,56px);\">\n        <img src=\"1ac87241-510f-4b53-a4e0-3279ff6be191\" alt=\"The Big Frame\" style=\"height:clamp(56px,9vw,80px);width:auto;display:block;\">\n      <\u002Fa>\n      <div style=\"display:flex;width:fit-content;align-items:center;gap:10px;background:#2E7D4F;color:#FFFFFF;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;padding:9px 16px;border-radius:100px;margin-bottom:24px;\">\n        <span style=\"width:8px;height:8px;border-radius:50%;background:#FFFFFF;\"><\u002Fspan>\n        Pagamento ricevuto\n      <\u002Fdiv>\n      <h1 style=\"font-size:clamp(40px,8vw,76px);font-weight:900;line-height:0.98;letter-spacing:-0.02em;margin:0 0 22px;text-wrap:balance;\">Ci vediamo a <span style=\"color:#E6592E;\">TheBigFrame.<\u002Fspan><\u002Fh1>\n      <p style=\"font-size:clamp(17px,2.4vw,20px);line-height:1.6;color:#D8D4C8;max-width:600px;margin:0;\">La tua iscrizione è confermata. PayPal ti ha mandato la ricevuta via email. Ti chiedo solo un ultimo passaggio: compila il modulo qui sotto.<\u002Fp>\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:14px;margin-top:clamp(36px,6vw,52px);\">\n        <div style=\"background:rgba(247,244,236,0.07);border:1px solid rgba(247,244,236,0.14);border-radius:16px;padding:20px 22px;\">\n          <div style=\"font-size:12px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#E6592E;margin-bottom:8px;\">Quando<\u002Fdiv>\n          <div style=\"font-size:20px;font-weight:800;line-height:1.3;\">Sabato 28 novembre 2026<\u002Fdiv>\n          <div style=\"font-size:15px;color:#B9B4A8;margin-top:4px;\">Check-in 8:30 · fine 19:00<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:rgba(247,244,236,0.07);border:1px solid rgba(247,244,236,0.14);border-radius:16px;padding:20px 22px;\">\n          <div style=\"font-size:12px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#E6592E;margin-bottom:8px;\">Dove<\u002Fdiv>\n          <div style=\"font-size:20px;font-weight:800;line-height:1.3;\">Villa Pieve Country House<\u002Fdiv>\n          <div style=\"font-size:15px;color:#B9B4A8;margin-top:4px;\">Corciano (PG), alle porte di Perugia<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:rgba(247,244,236,0.07);border:1px solid rgba(247,244,236,0.14);border-radius:16px;padding:20px 22px;\">\n          <div style=\"font-size:12px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#E6592E;margin-bottom:8px;\">Incluso<\u002Fdiv>\n          <div style=\"font-size:20px;font-weight:800;line-height:1.3;\">Tutta la giornata<\u002Fdiv>\n          <div style=\"font-size:15px;color:#B9B4A8;margin-top:4px;\">Coffee break e light lunch<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div data-screen-label=\"Modulo\" id=\"modulo\" style=\"padding:clamp(56px,9vw,96px) 24px;\">\n    <div style=\"max-width:760px;margin:0 auto;\">\n      <div style=\"display:flex;align-items:center;gap:14px;margin-bottom:16px;\">\n        <span style=\"width:40px;height:40px;border-radius:50%;background:#E6592E;color:#FFFFFF;font-size:18px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;\">1<\u002Fspan>\n        <span style=\"font-size:14px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#8C5A34;\">Un ultimo passaggio<\u002Fspan>\n      <\u002Fdiv>\n      <h2 style=\"font-size:clamp(30px,5vw,44px);font-weight:800;line-height:1.1;margin:0 0 14px;text-wrap:balance;\">Completa i tuoi dati<\u002Fh2>\n      <p style=\"font-size:17px;line-height:1.6;color:#4A473F;margin:0 0 32px;max-width:600px;\">Ci servono per stampare attestato e badge con il tuo nome e per organizzare il light lunch. Bastano due minuti.<\u002Fp>\n      <div style=\"background:#FFFFFF;border-radius:20px;border:1px solid rgba(27,26,23,0.08);box-shadow:0 20px 50px rgba(27,26,23,0.08);padding:clamp(24px,5vw,44px);\">\n        <sc-if value=\"{{ notSent }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex;flex-direction:column;gap:26px;\">\n            <sc-for list=\"{{ fields }}\" as=\"f\" hint-placeholder-count=\"5\">\n              <label style=\"display:flex;flex-direction:column;gap:8px;\">\n                <span style=\"font-size:15px;font-weight:700;color:#1B1A17;\">{{ f.label }} <span style=\"color:#E6592E;\">{{ f.star }}<\u002Fspan><\u002Fspan>\n                <sc-if value=\"{{ f.isInput }}\" hint-placeholder-val=\"{{ true }}\">\n                  <input type=\"{{ f.type }}\" name=\"{{ f.key }}\" value=\"{{ f.value }}\" sc-camel-on-change=\"{{ f.onChange }}\" autocomplete=\"{{ f.auto }}\" style=\"font-family:inherit;font-size:17px;padding:14px 16px;border:1.5px solid {{ f.border }};border-radius:12px;background:#FBFAF6;color:#1B1A17;outline:none;width:100%;\" style-focus=\"border-color:#E6592E;background:#FFFFFF;\">\n                <\u002Fsc-if>\n                <sc-if value=\"{{ f.isArea }}\" hint-placeholder-val=\"{{ false }}\">\n                  <textarea name=\"{{ f.key }}\" value=\"{{ f.value }}\" sc-camel-on-change=\"{{ f.onChange }}\" rows=\"3\" placeholder=\"Lascia vuoto se non hai esigenze particolari\" style=\"font-family:inherit;font-size:17px;padding:14px 16px;border:1.5px solid rgba(27,26,23,0.15);border-radius:12px;background:#FBFAF6;color:#1B1A17;outline:none;width:100%;resize:vertical;\" style-focus=\"border-color:#E6592E;background:#FFFFFF;\"><\u002Ftextarea>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ f.hasError }}\" hint-placeholder-val=\"{{ false }}\">\n                  <span style=\"font-size:13px;font-weight:600;color:#B3261E;\">{{ f.error }}<\u002Fspan>\n                <\u002Fsc-if>\n              <\u002Flabel>\n            <\u002Fsc-for>\n\n            <div style=\"display:flex;flex-direction:column;gap:12px;\">\n              <span style=\"font-size:15px;font-weight:700;color:#1B1A17;\">Come hai conosciuto TheBigFrame?<\u002Fspan>\n              <div style=\"display:flex;flex-wrap:wrap;gap:10px;\">\n                <sc-for list=\"{{ sources }}\" as=\"o\" hint-placeholder-count=\"7\">\n                  <button type=\"button\" sc-camel-on-click=\"{{ o.onClick }}\" style=\"font-family:inherit;font-size:15px;font-weight:600;padding:11px 18px;border-radius:100px;border:1.5px solid {{ o.border }};background:{{ o.bg }};color:{{ o.fg }};cursor:pointer;text-align:left;\">{{ o.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:flex;flex-direction:column;align-items:flex-start;gap:12px;border-top:1px solid rgba(27,26,23,0.08);padding-top:26px;\">\n              <button type=\"button\" sc-camel-on-click=\"{{ submit }}\" style=\"font-family:inherit;font-size:17px;font-weight:800;padding:17px 36px;border:0;border-radius:100px;background:#E6592E;color:#FFFFFF;cursor:pointer;\" style-hover=\"background:#C94C25;\">{{ submitLabel }}<\u002Fbutton>\n              <sc-if value=\"{{ hasSendError }}\" hint-placeholder-val=\"{{ false }}\">\n                <span style=\"font-size:14px;font-weight:600;color:#B3261E;\">Invio non riuscito. Riprova, oppure scrivimi su WhatsApp.<\u002Fspan>\n              <\u002Fsc-if>\n              <span style=\"font-size:13px;color:#8D897E;\">I campi con * sono obbligatori.<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ sent }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"text-align:center;padding:clamp(16px,4vw,32px) 0;\">\n            <div style=\"width:64px;height:64px;border-radius:50%;background:#2E7D4F;margin:0 auto 22px;display:flex;align-items:center;justify-content:center;\">\n              <svg sc-camel-view-box=\"0 0 24 24\" width=\"30\" height=\"30\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7.5\" stroke=\"#FFFFFF\" stroke-width=\"2.6\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n            <\u002Fdiv>\n            <div style=\"font-size:clamp(24px,4vw,30px);font-weight:800;margin-bottom:10px;\">Grazie, {{ firstName }}!<\u002Fdiv>\n            <p style=\"font-size:17px;line-height:1.6;color:#4A473F;margin:0 auto;max-width:440px;\">Abbiamo ricevuto i tuoi dati. Il 28 novembre troverai attestato e badge con il tuo nome.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div data-screen-label=\"Programma\" style=\"background:#1B1A17;color:#F7F4EC;padding:clamp(56px,9vw,96px) 24px;\">\n    <div style=\"max-width:760px;margin:0 auto;\">\n      <div style=\"font-size:14px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#9A968B;margin-bottom:14px;\">Sabato 28 novembre<\u002Fdiv>\n      <h2 style=\"font-size:clamp(30px,5vw,44px);font-weight:800;line-height:1.1;margin:0 0 36px;\">Il programma<\u002Fh2>\n      <div style=\"display:flex;flex-direction:column;\">\n        <sc-for list=\"{{ programma }}\" as=\"row\" hint-placeholder-count=\"13\">\n          <div style=\"display:grid;grid-template-columns:minmax(0,108px) minmax(0,1fr);gap:16px;padding:16px 0;border-top:1px solid rgba(247,244,236,0.12);align-items:baseline;\">\n            <div style=\"font-size:14px;font-weight:700;color:{{ row.timeColor }};font-variant-numeric:tabular-nums;\">{{ row.time }}<\u002Fdiv>\n            <div style=\"font-size:{{ row.size }};font-weight:{{ row.weight }};line-height:1.4;color:{{ row.color }};\">{{ row.title }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div data-screen-label=\"Come arrivare\" style=\"padding:clamp(56px,9vw,96px) 24px;\">\n    <div style=\"max-width:880px;margin:0 auto;\">\n      <div style=\"font-size:14px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#8C5A34;margin-bottom:14px;\">Come arrivare<\u002Fdiv>\n      <h2 style=\"font-size:clamp(30px,5vw,44px);font-weight:800;line-height:1.1;margin:0 0 20px;\">Villa Pieve Country House<\u002Fh2>\n      <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:16px 24px;margin-bottom:32px;\">\n        <div style=\"font-size:18px;font-weight:600;line-height:1.5;\">Via Bonciari 126 — 06073 Loc. Pieve del Vescovo — Corciano (PG)<\u002Fdiv>\n        <a href=\"https://www.google.com/maps/search/?api=1&amp;query=Villa+Pieve+Country+House+Via+Bonciari+126+Corciano+PG\" target=\"_blank\" rel=\"noopener\" style=\"background:#E6592E;color:#FFFFFF;font-size:15px;font-weight:800;padding:13px 24px;border-radius:100px;white-space:nowrap;\">Apri in Google Maps<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"border-radius:20px;overflow:hidden;border:1px solid rgba(27,26,23,0.08);margin-bottom:28px;aspect-ratio:16/9;min-height:260px;background:#EFEBE0;\">\n        <iframe src=\"https://maps.google.com/maps?q=Via%20Bonciari%20126%2C%20Corciano%20PG&amp;z=15&amp;output=embed\" title=\"Mappa Villa Pieve\" style=\"display:block;width:100%;height:100%;border:0;\" loading=\"lazy\"><\u002Fiframe>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:16px;\">\n        <div style=\"background:#FFFFFF;border-radius:16px;padding:24px;border:1px solid rgba(27,26,23,0.08);\">\n          <div style=\"font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:#E6592E;margin-bottom:10px;\">In auto<\u002Fdiv>\n          <div style=\"font-size:16px;line-height:1.6;color:#3A3730;\">Parcheggio gratuito davanti al castello, a pochi passi dalla villa.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#FFFFFF;border-radius:16px;padding:24px;border:1px solid rgba(27,26,23,0.08);\">\n          <div style=\"font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:#E6592E;margin-bottom:10px;\">In treno<\u002Fdiv>\n          <div style=\"font-size:16px;line-height:1.6;color:#3A3730;\">Stazione di Perugia Fontivegge, poi circa 15 minuti in taxi o in auto.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#FFFFFF;border-radius:16px;padding:24px;border:1px solid rgba(27,26,23,0.08);\">\n          <div style=\"font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:#E6592E;margin-bottom:10px;\">In aereo<\u002Fdiv>\n          <div style=\"font-size:16px;line-height:1.6;color:#3A3730;\">Aeroporto dell'Umbria a Sant'Egidio, a circa 25 minuti. Dal resto d'Italia: Roma Fiumicino o Firenze, poi treno per Perugia.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div data-screen-label=\"Contatti\" style=\"background:#F3DFC9;padding:clamp(56px,9vw,88px) 24px;\">\n    <div style=\"max-width:760px;margin:0 auto;text-align:center;\">\n      <h2 style=\"font-size:clamp(28px,4.5vw,40px);font-weight:800;line-height:1.15;margin:0 0 14px;text-wrap:balance;\">Hai una domanda?<\u002Fh2>\n      <p style=\"font-size:17px;line-height:1.6;color:#4A473F;margin:0 auto 28px;max-width:520px;\">Scrivimi su WhatsApp, ti rispondo io. Se ti serve la fattura, mandami i tuoi dati: nome o ragione sociale, codice fiscale o partita IVA, indirizzo e codice SDI o PEC.<\u002Fp>\n      <a href=\"https://wa.me/393405984150?text=Ciao%20Davide%2C%20mi%20sono%20iscritto%20a%20TheBigFrame%20e%20ho%20una%20domanda%3A%20\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;gap:10px;background:#25D366;color:#FFFFFF;font-size:16px;font-weight:800;padding:16px 30px;border-radius:100px;\">\n        <svg sc-camel-view-box=\"0 0 32 32\" width=\"20\" height=\"20\" aria-hidden=\"true\" fill=\"#FFFFFF\"><path d=\"M16.04 3C9.37 3 3.98 8.39 3.98 15.06c0 2.23.6 4.32 1.65 6.12L3 29l8.02-2.58a12.02 12.02 0 0 0 5.02 1.1h.01c6.66 0 12.06-5.4 12.06-12.06C28.11 8.39 22.71 3 16.04 3zm0 22.03h-.01c-1.62 0-3.2-.43-4.6-1.25l-.33-.2-4.76 1.53 1.55-4.63-.21-.34a9.93 9.93 0 0 1-1.53-5.08c0-5.5 4.47-9.97 9.98-9.97 5.5 0 9.97 4.47 9.97 9.98 0 5.5-4.48 9.96-10.06 9.96zm5.47-7.46c-.3-.15-1.77-.87-2.04-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.65.07-.3-.15-1.26-.46-2.4-1.48-.89-.79-1.49-1.77-1.66-2.07-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.67-1.62-.92-2.22-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.88 1.21 3.08c.15.2 2.1 3.2 5.08 4.49.71.31 1.26.49 1.69.63.71.23 1.36.2 1.87.12.57-.08 1.77-.72 2.02-1.42.25-.7.25-1.3.17-1.42-.07-.12-.27-.2-.57-.35z\"><\u002Fpath><\u002Fsvg>\n        Scrivimi su WhatsApp\n      <\u002Fa>\n      <div style=\"font-size:15px;color:#6B5A48;margin-top:14px;\">+39 340 598 4150<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"padding:32px 24px;text-align:center;font-size:13px;color:#8D897E;\">\n    TheBigFrame è un evento organizzato da Davide Vasta · <a href=\"https://thebigframe.it\" style=\"color:#8D897E;font-weight:700;\">Torna alla pagina dell'evento<\u002Fa>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst FORM_POST = 'https://docs.google.com/forms/d/e/1FAIpQLScMFghuqxpiD4m0oFHtOn289r5r0WdkS4MOC0iXudescpRn8w/formResponse';\nconst FIELD_DEFS = [\n  { key: 'nome', entry: 'entry.590377199', label: 'Nome e cognome (per attestato e badge)', type: 'text', auto: 'name', required: true },\n  { key: 'emailPaypal', entry: 'entry.1424346378', label: 'Email usata per il pagamento PayPal', type: 'email', auto: 'email', required: true, email: true },\n  { key: 'email', entry: 'entry.518556241', label: 'Email per le comunicazioni', type: 'email', auto: 'email', required: true, email: true },\n  { key: 'telefono', entry: 'entry.1560724609', label: 'Cell / WhatsApp', type: 'tel', auto: 'tel', required: false },\n  { key: 'intolleranze', entry: 'entry.1809699157', label: 'Intolleranze o esigenze alimentari per il light lunch', area: true, required: false },\n];\nconst SOURCE_ENTRY = 'entry.1484186672';\nconst SOURCES = ['Edizione precedente', 'Instagram / Facebook', 'Newsletter Nikon', 'Newsletter DropFrame', 'Passaparola', 'Media partner (Phocus, TuttoDigitale, Videomakers.net\\u2026)', 'Altro'];\n\nclass Component extends DCLogic {\n  state = { v: {}, source: '', errors: {}, status: 'idle' };\n\n  validate() {\n    const errors = {};\n    for (const f of FIELD_DEFS) {\n      const val = String(this.state.v[f.key] || '').trim();\n      if (f.required && !val) errors[f.key] = 'Campo obbligatorio';\n      else if (f.email && val && !/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(val)) errors[f.key] = 'Controlla l\\u2019indirizzo email';\n    }\n    return errors;\n  }\n\n  async submit() {\n    if (this.state.status === 'sending') return;\n    const errors = this.validate();\n    this.setState({ errors });\n    if (Object.keys(errors).length) return;\n    this.setState({ status: 'sending' });\n    const body = new URLSearchParams();\n    for (const f of FIELD_DEFS) body.append(f.entry, String(this.state.v[f.key] || '').trim());\n    if (this.state.source) body.append(SOURCE_ENTRY, this.state.source);\n    try {\n      await fetch(FORM_POST, { method: 'POST', mode: 'no-cors', body });\n      this.setState({ status: 'sent' });\n    } catch (e) {\n      this.setState({ status: 'error' });\n    }\n  }\n\n  renderVals() {\n    const { v, errors, source, status } = this.state;\n    const fields = FIELD_DEFS.map(f => ({\n      key: f.key, label: f.label, type: f.type || 'text', auto: f.auto || 'off',\n      star: f.required ? '*' : '',\n      isInput: !f.area, isArea: !!f.area,\n      value: v[f.key] || '',\n      hasError: !!errors[f.key], error: errors[f.key] || '',\n      border: errors[f.key] ? '#B3261E' : 'rgba(27,26,23,0.15)',\n      onChange: (e) => this.setState(s => ({ v: { ...s.v, [f.key]: e.target.value }, errors: { ...s.errors, [f.key]: undefined } })),\n    }));\n    const sources = SOURCES.map(label => {\n      const on = source === label;\n      return {\n        label,\n        bg: on ? '#1B1A17' : '#FFFFFF', fg: on ? '#F7F4EC' : '#1B1A17',\n        border: on ? '#1B1A17' : 'rgba(27,26,23,0.18)',\n        onClick: () => this.setState({ source: on ? '' : label }),\n      };\n    });\n    const firstName = String(v.nome || '').trim().split(/\\s+/)[0] || '';\n    const rows = [\n      ['08:30–09:00', 'Check-in', 'info'],\n      ['09:00–09:05', 'Benvenuto', 'info'],\n      ['09:05–10:20', 'La luce come progetto — Francesco Francia', 'talk'],\n      ['10:20–10:40', 'Networking e Coffee Break', 'break'],\n      ['10:40–11:55', 'L\\u2019emozione attraverso la fotografia creativa — Damiano Lamonaca', 'talk'],\n      ['11:55–12:55', 'Light Lunch', 'break'],\n      ['12:55–14:10', 'Fotografia e intelligenza artificiale — Marco Castellani', 'talk'],\n      ['14:10–14:45', 'Intervento Nikon — Roberto Bachis', 'talk'],\n      ['14:45–16:00', 'Raccontare un matrimonio — Daniele Donati', 'talk'],\n      ['16:00–16:20', 'Networking e Coffee Break', 'break'],\n      ['16:20–17:35', 'La tecnica si impara, la storia si costruisce — Adriano Giotti', 'talk'],\n      ['17:35–18:50', 'La produzione video ibrida — Davide Vasta', 'talk'],\n      ['18:50–19:00', 'Saluti finali', 'info'],\n    ];\n    const programma = rows.map(([time, title, kind]) => ({\n      time, title,\n      timeColor: kind === 'talk' ? '#E6592E' : '#9A968B',\n      color: kind === 'talk' ? '#F7F4EC' : '#B9B4A8',\n      weight: kind === 'talk' ? 700 : 500,\n      size: kind === 'talk' ? '17px' : '15px',\n    }));\n    return {\n      programma, fields, sources, firstName,\n      sent: status === 'sent', notSent: status !== 'sent',\n      hasSendError: status === 'error',\n      submitLabel: status === 'sending' ? 'Invio in corso\\u2026' : 'Invia i miei dati',\n      submit: () => this.submit(),\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
